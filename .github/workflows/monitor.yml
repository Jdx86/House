name: Porto House Monitor

on:
  schedule:
    # 08:00-00:00 Europe/Lisbon every 2h (window closes before 1am). GitHub
    # Actions cron is UTC-fixed (no DST auto-adjust) - this is UTC+1 (WEST,
    # Lisbon summer time).
    # Re-registered 2026-09-04: schedule was not firing on GitHub's cron
    # scheduler; touching this file forces re-indexing.
    - cron: "0 7,9,11,13,15,17,19,21,23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: porto-house-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run monitor
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: jorge_hernani@msn.com
          RESEND_FROM_EMAIL: onboarding@resend.dev
        run: python monitor.py
